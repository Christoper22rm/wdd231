<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Contact Us | Electric Vehicles Hub</title>
  <meta name="description" content="Contact us to learn more about electric vehicles, request information, and get personalized recommendations to start your EV journey today.">
  <meta name="author" content="Christoper Calvachi">

  <!-- Open Graph -->
  <meta property="og:title" content="Contact | Electric Vehicles Hub">
  <meta property="og:description" content="Reach out to us for expert guidance on electric vehicles, comparisons, and recommendations tailored to your needs.">
  <meta property="og:image" content="https://christoper22rm.github.io/wdd231/final/images/preview.webp">
  <meta property="og:url" content="https://christoper22rm.github.io/wdd231/final/contact.html">

  <!-- Favicon -->
  <link rel="icon" href="./images/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./styles/index.css">
  <link rel="stylesheet" href="./styles/contact.css">
  <link rel="stylesheet" href="./styles/responsive.css">

  <!-- JS -->
  <script type="module" src="./scripts/main.js"></script>
  <script type="module" src="./scripts/contact.js"></script>
</head>

<body>

<header>
  <div class="header-container">
    <div class="logo">EV Hub</div>

    <nav>
      <button class="menu-btn" aria-label="Open menu">☰</button>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </div>
</header>

<main>

  <h1>Contact Us</h1>

  <section class="contact-container">
    <h2 class="section-title">Send Us a Message</h2>

    <form method="GET" action="thankyou.html">

      <label for="name">
        Full Name
      </label>
      <input id="name" type="text" name="name" required>

      <label for="email">
        Email
      </label>
      <input id="email" type="email" name="email" required>

      <label for="brand">
        Favorite EV Brand
      </label>
      <select id="brand" name="brand" required>
        <option value="">Select</option>
        <option value="Tesla">Tesla</option>
        <option value="BYD">BYD</option>
        <option value="Hyundai">Hyundai</option>
        <option value="Nissan">Nissan</option>
      </select>

      <label for="message">
        Message
      </label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit">Send Message</button>

    </form>

  </section>

</main>

<footer>
  <p>&copy; 2026 Electric Vehicles Hub</p>
  <a href="attributions.html">Attributions</a>
  <a href="https://youtu.be/5GZf5cRmpWk" target="_blank">Project Video</a>
</footer>

</body>
</html>
